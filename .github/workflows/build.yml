name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose repository contents
        run: |
          echo "== Repo root =="
          ls -la
          echo "== git ls-files (tracked files) matching android/ =="
          git ls-files | grep '^android/' || echo "NO FILES under android/ are tracked by git"
          echo "== Current branch/ref =="
          git branch -a
          git status

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Bootstrap Gradle wrapper
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "::warning::android/ directory missing from checkout — regenerating Android platform files."

            PROJECT_NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')

            flutter create --platforms=android --project-name "$PROJECT_NAME" --org com.kikikokomama.musicplayer .

            git status
          fi

          WRAPPER_SCRIPT="android/gradle/wrapper/bootstrap-wrapper.sh"

          if [ -f "$WRAPPER_SCRIPT" ]; then
            echo "Found $WRAPPER_SCRIPT, running it."
            chmod +x "$WRAPPER_SCRIPT"
            "./$WRAPPER_SCRIPT"
          else
            echo "::warning::$WRAPPER_SCRIPT not found — falling back to standard Gradle wrapper generation."

            if [ ! -f android/gradlew ]; then
              (cd android && gradle wrapper --gradle-version 8.9)
            fi

            chmod +x android/gradlew
          fi

          test -x android/gradlew || { echo "::error::android/gradlew still missing/not executable after bootstrap."; exit 1; }

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (non-release CI)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: flutter build apk --debug --split-per-abi

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release

      - name: Verify 16 KB native-library alignment
        run: |
          set -euo pipefail
          shopt -s nullglob

          apks=(build/app/outputs/flutter-apk/*.apk)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs produced; alignment verification cannot run."
            exit 1
          fi

          NDK_READelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$NDK_READelf"

          for apk in "${apks[@]}"; do
            echo "Checking ZIP alignment: $apk"

            zipalign -c -P 16 -v 4 "$apk" >/dev/null

            tmp="$(mktemp -d)"

            unzip -q "$apk" 'lib/*/*.so' -d "$tmp"

            while IFS= read -r -d '' so; do
              python3 - "$so" "$NDK_READelf" <<'PY'
              import subprocess
              import sys

              so = sys.argv[1]
              readelf = sys.argv[2]

              out = subprocess.check_output(
                  [readelf, "-l", so],
                  text=True,
              )

              aligns = []

              for line in out.splitlines():
                  fields = line.split()

                  if (
                      fields
                      and fields[0] == "LOAD"
                      and fields[-1].startswith("0x")
                  ):
                      aligns.append(int(fields[-1], 16))

              if aligns and min(aligns) < 0x4000:
                  raise SystemExit(
                      f"ELF LOAD alignment < 16 KiB: {so}: {aligns}"
                  )
              PY
            done < <(find "$tmp/lib" -name '*.so' -print0)

            rm -rf "$tmp"
          done

      - name: Verify 16 KB alignment in AAB-generated APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUNDLETOOL_VERSION=1.18.1

          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=aab-universal.apks \
            --mode=universal \
            --ks=android/release-key.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"

          unzip -q aab-universal.apks -d aab-apks

          test -f aab-apks/universal.apk

          zipalign -c -P 16 -v 4 aab-apks/universal.apk >/dev/null

          tmp="$(mktemp -d)"

          unzip -q aab-apks/universal.apk 'lib/*/*.so' -d "$tmp"

          NDK_READelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$NDK_READelf"

          while IFS= read -r -d '' so; do
            python3 - "$so" "$NDK_READelf" <<'PY'
            import subprocess
            import sys

            so = sys.argv[1]
            readelf = sys.argv[2]

            out = subprocess.check_output(
                [readelf, "-l", so],
                text=True,
            )

            for line in out.splitlines():
                fields = line.split()

                if (
                    fields
                    and fields[0] == "LOAD"
                    and fields[-1].startswith("0x")
                ):
                    if int(fields[-1], 16) < 0x4000:
                        raise SystemExit(
                            f"ELF LOAD alignment < 16 KiB: {so}: {fields[-1]}"
                        )
            PY
          done < <(find "$tmp/lib" -name '*.so' -print0)

          rm -rf "$tmp" aab-apks aab-universal.apks bundletool.jar

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: offline-music-player-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Remove release signing material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f android/release-key.jks android/key.properties

