name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # ============================================================
      # FIND / EXTRACT FLUTTER PROJECT
      # ============================================================
      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Repository contents"
          echo "========================================"
          ls -la

          PROJECT_DIR=""

          # 1. Check repository root
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$(pwd)"
          fi

          # 2. If not found, search existing directories
          if [ -z "$PROJECT_DIR" ]; then
            FOUND="$(find . -type f -name pubspec.yaml \
              -not -path './.git/*' \
              -print -quit || true)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
            fi
          fi

          # 3. If still not found, extract ZIP files
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' \
              -not -path './.git/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No pubspec.yaml and no ZIP file containing the Flutter project was found."
              exit 1
            fi

            echo "Found Flutter project archive:"
            echo "$ZIP_FILE"

            mkdir -p .ci-extracted

            unzip -q "$ZIP_FILE" -d .ci-extracted

            echo "Extracted files:"
            find .ci-extracted -maxdepth 3 -type f | head -200

            FOUND="$(find .ci-extracted -type f -name pubspec.yaml \
              -print -quit || true)"

            if [ -z "$FOUND" ]; then
              echo "::error::ZIP was extracted, but no pubspec.yaml was found."
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
          fi

          echo "========================================"
          echo "Flutter project detected"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Project contents"
          echo "========================================"
          ls -la "$PROJECT_DIR"

          test -f "$PROJECT_DIR/pubspec.yaml"

      # ============================================================
      # ANDROID PLATFORM + GRADLE WRAPPER
      # ============================================================
      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Preparing Android platform"
          echo "========================================"

          echo "Project:"
          pwd

          echo "pubspec.yaml:"
          test -f pubspec.yaml

          PROJECT_NAME="$(awk '/^name:/ {print $2; exit}' pubspec.yaml)"

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Could not determine Flutter project name from pubspec.yaml"
            exit 1
          fi

          echo "Project name: $PROJECT_NAME"

          # ----------------------------------------------------------
          # Generate Android platform if missing
          # ----------------------------------------------------------
          if [ ! -d android ]; then
            echo "::warning::android/ directory is missing."
            echo "Generating Android platform..."

            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.kikikokomama.musicplayer \
              .

          else
            echo "android/ directory already exists."
          fi

          # ----------------------------------------------------------
          # Ensure Gradle wrapper exists
          # ----------------------------------------------------------
          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            echo "::warning::Gradle wrapper is incomplete."
            echo "Regenerating Android Gradle wrapper..."

            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.kikikokomama.musicplayer \
              .

          fi

          # ----------------------------------------------------------
          # Final verification
          # ----------------------------------------------------------
          echo "========================================"
          echo "Android verification"
          echo "========================================"

          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "Android directory:"
          find android -maxdepth 3 -type f | sort | head -200

          echo "Gradle wrapper:"
          ls -lh android/gradlew
          ls -lh android/gradle/wrapper/

      # ============================================================
      # FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================================
      # ISAR CODE GENERATION
      # ============================================================
      - name: Generate Isar code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          dart run build_runner build \
            --delete-conflicting-outputs

      # ============================================================
      # ANALYZE
      # ============================================================
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter analyze

      # ============================================================
      # TEST
      # ============================================================
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter test

      # ============================================================
      # DEBUG APK
      # ============================================================
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --split-per-abi

      # ============================================================
      # RELEASE SIGNING
      # ============================================================
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/release-key.jks
          chmod 600 android/key.properties

      # ============================================================
      # RELEASE APK
      # ============================================================
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --split-per-abi

      # ============================================================
      # RELEASE AAB
      # ============================================================
      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build appbundle \
            --release

      # ============================================================
      # VERIFY 16 KB APK ALIGNMENT
      # ============================================================
      - name: Verify 16 KB native-library alignment
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          shopt -s nullglob

          apks=(
            build/app/outputs/flutter-apk/*.apk
          )

          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APKs produced."
            exit 1
          fi

          NDK_READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          test -x "$NDK_READELF"

          for apk in "${apks[@]}"; do

            echo "========================================"
            echo "Checking APK:"
            echo "$apk"
            echo "========================================"

            zipalign -c -P 16 -v 4 "$apk"

            tmp="$(mktemp -d)"

            unzip -q "$apk" 'lib/*/*.so' -d "$tmp" || true

            while IFS= read -r -d '' so; do

              python3 - "$so" "$NDK_READELF" <<'PY'
import subprocess
import sys

so = sys.argv[1]
readelf = sys.argv[2]

out = subprocess.check_output(
    [readelf, "-l", so],
    text=True,
)

aligns = []

for line in out.splitlines():
    fields = line.split()

    if (
        fields
        and fields[0] == "LOAD"
        and fields[-1].startswith("0x")
    ):
        aligns.append(int(fields[-1], 16))

if aligns and min(aligns) < 0x4000:
    raise SystemExit(
        f"ELF LOAD alignment < 16 KiB: {so}: {aligns}"
    )

print(f"OK: {so}: {aligns}")
PY

            done < <(
              find "$tmp/lib" \
                -name '*.so' \
                -print0 2>/dev/null || true
            )

            rm -rf "$tmp"

          done

      # ============================================================
      # VERIFY AAB GENERATED APK
      # ============================================================
      - name: Verify 16 KB alignment in AAB-generated APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUNDLETOOL_VERSION="1.18.1"

          curl -fsSL \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=aab-universal.apks \
            --mode=universal \
            --ks=android/release-key.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"

          unzip -q aab-universal.apks -d aab-apks

          test -f aab-apks/universal.apk

          zipalign -c -P 16 -v 4 \
            aab-apks/universal.apk

          tmp="$(mktemp -d)"

          unzip -q \
            aab-apks/universal.apk \
            'lib/*/*.so' \
            -d "$tmp" || true

          NDK_READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          test -x "$NDK_READELF"

          while IFS= read -r -d '' so; do

            python3 - "$so" "$NDK_READELF" <<'PY'
import subprocess
import sys

so = sys.argv[1]
readelf = sys.argv[2]

out = subprocess.check_output(
    [readelf, "-l", so],
    text=True,
)

for line in out.splitlines():
    fields = line.split()

    if (
        fields
        and fields[0] == "LOAD"
        and fields[-1].startswith("0x")
    ):
        alignment = int(fields[-1], 16)

        if alignment < 0x4000:
            raise SystemExit(
                f"ELF LOAD alignment < 16 KiB: "
                f"{so}: {fields[-1]}"
            )

print(f"OK: {so}")
PY

          done < <(
            find "$tmp/lib" \
              -name '*.so' \
              -print0 2>/dev/null || true
          )

          rm -rf \
            "$tmp" \
            aab-apks \
            aab-universal.apks \
            bundletool.jar

      # ============================================================
      # UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: offline-music-player-apks
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab

      # ============================================================
      # CLEAN SIGNING MATERIAL
      # ============================================================
      - name: Remove release signing material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          rm -f \
            "$PROJECT_DIR/android/release-key.jks" \
            "$PROJECT_DIR/android/key.properties"
