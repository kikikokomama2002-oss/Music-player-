name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Flutter Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$(pwd)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND="$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -print -quit || true)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Flutter project found."
              exit 1
            fi

            rm -rf .ci-extracted
            mkdir -p .ci-extracted

            unzip -q "$ZIP_FILE" -d .ci-extracted

            FOUND="$(find .ci-extracted -type f -name "pubspec.yaml" -print -quit || true)"

            if [ -z "$FOUND" ]; then
              echo "::error::No pubspec.yaml found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Diagnose environment
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

      - name: Fix Isar version mismatch (Pin to 3.3.1)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Remove all old conflicting packages
          flutter pub remove build_runner isar_community isar_community_flutter_libs isar_community_generator dart_style analyzer || true

          # CRITICAL FIX: Pin ALL Isar packages to EXACTLY 3.3.1.
          # This aligns the runtime, native libs, and generator perfectly.
          flutter pub add isar_community:3.3.1 isar_community_flutter_libs:3.3.1
          
          # Let pub resolve the latest build_runner (2.5.x), which natively supports dart_style 3.x.
          flutter pub add dev:build_runner dev:isar_community_generator:3.3.1

          echo "--- FINAL PUBSPEC CONFIGURATION ---"
          grep -E "isar_community:|isar_community_flutter_libs:|isar_community_generator:|build_runner:" pubspec.yaml || true

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PROJECT_NAME="$(awk '/^name:/ {print $2; exit}' pubspec.yaml)"

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Could not determine Flutter project name."
            exit 1
          fi

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.kikikokomama.musicplayer \
              .
          fi

          if [ ! -f "android/gradlew" ] || \
             [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || \
             [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then

            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.kikikokomama.musicplayer \
              .
          fi

          chmod +x android/gradlew

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          NDK_VERSION="28.2.13676358"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi

          if [ -f android/app/build.gradle.kts ]; then
            if grep -q "ndkVersion" android/app/build.gradle.kts; then
              sed -i -E \
                's/ndkVersion[[:space:]]*=[[:space:]]*[^[:space:]]+/ndkVersion = "28.2.13676358"/' \
                android/app/build.gradle.kts
            else
              sed -i '/android {/a\    ndkVersion = "28.2.13676358"' \
                android/app/build.gradle.kts
            fi
          elif [ -f android/app/build.gradle ]; then
            if grep -q "ndkVersion" android/app/build.gradle; then
              sed -i -E \
                's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\'']?[0-9.]+["'\'']?/ndkVersion "28.2.13676358"/' \
                android/app/build.gradle
            else
              sed -i '/android {/a\    ndkVersion "28.2.13676358"' \
                android/app/build.gradle
            fi
          fi

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -f pubspec.lock

          flutter pub get

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart pub deps --style=compact | grep -E \
            "build_runner|isar_community_generator|dart_style" || true

      - name: Generate Isar code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          
          echo "Removing ALL caches to force a completely fresh clean resolution..."
          rm -rf .dart_tool
          rm -f pubspec.lock
          
          echo "Fetching fresh dependencies..."
          flutter pub get
          
          echo "Running build_runner..."
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter test

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --split-per-abi

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/release-key.jks
          chmod 600 android/key.properties

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --split-per-abi

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build appbundle \
            --release

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          test -n "$BUILD_TOOLS_DIR"
          test -x "$BUILD_TOOLS_DIR/zipalign"

          echo "ZIPALIGN=$BUILD_TOOLS_DIR/zipalign" >> "$GITHUB_ENV"

      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          shopt -s nullglob

          apks=(build/app/outputs/flutter-apk/*.apk)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APKs produced."
            exit 1
          fi

          NDK_READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          test -x "$NDK_READELF"

          for apk in "${apks[@]}"; do

            echo "Checking $apk"

            "$ZIPALIGN" -c -P 16 -v 4 "$apk"

            TMP_DIR="$(mktemp -d)"

            unzip -q "$apk" 'lib/*/*.so' -d "$TMP_DIR" || true

            if [ -d "$TMP_DIR/lib" ]; then

              while IFS= read -r -d '' so; do

                echo "Checking ELF: $so"

                "$NDK_READELF" -lW "$so" |
                  awk '$1 == "LOAD" {print $NF}' |
                  while read -r alignment; do

                    value=$((alignment))

                    if [ "$value" -lt 16384 ]; then
                      echo "::error::ELF LOAD alignment below 16 KiB: $so"
                      echo "::error::Alignment: $alignment"
                      exit 1
                    fi

                  done

              done < <(
                find "$TMP_DIR/lib" \
                  -type f \
                  -name "*.so" \
                  -print0
              )

            fi

            rm -rf "$TMP_DIR"

          done

      - name: Verify AAB 16 KB alignment
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUNDLETOOL_VERSION="1.18.1"

          curl -fsSL \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=aab-universal.apks \
            --mode=universal \
            --ks=android/release-key.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"

          rm -rf aab-apks
          mkdir -p aab-apks

          unzip -q aab-universal.apks -d aab-apks

          test -f aab-apks/universal.apk

          "$ZIPALIGN" -c -P 16 -v 4 \
            aab-apks/universal.apk

          NDK_READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          test -x "$NDK_READELF"

          TMP_DIR="$(mktemp -d)"

          unzip -q \
            aab-apks/universal.apk \
            'lib/*/*.so' \
            -d "$TMP_DIR" || true

          if [ -d "$TMP_DIR/lib" ]; then

            while IFS= read -r -d '' so; do

              echo "Checking AAB ELF: $so"

              "$NDK_READELF" -lW "$so" |
                awk '$1 == "LOAD" {print $NF}' |
                while read -r alignment; do

                  value=$((alignment))

                  if [ "$value" -lt 16384 ]; then
                    echo "::error::AAB ELF LOAD alignment below 16 KiB: $so"
                    echo "::error::Alignment: $alignment"
                    exit 1
                  fi

                done

            done < <(
              find "$TMP_DIR/lib" \
                -type f \
                -name "*.so" \
                -print0
            )

          fi

          rm -rf \
            "$TMP_DIR" \
            aab-apks \
            aab-universal.apks \
            bundletool.jar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-music-player-apks
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab

      - name: Remove release signing material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${PROJECT_DIR:-}" ]; then
            rm -f \
              "$PROJECT_DIR/android/release-key.jks" \
              "$PROJECT_DIR/android/key.properties"
          fi
